<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Котограм • Империя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toast" id="toast"></div>

    <!-- 🛠️ Тех. работы -->
    <div class="maintenance-overlay hidden" id="maintenanceOverlay">
        <div class="maintenance-icon">🛠️</div>
        <div class="maintenance-title">Проходят технические работы</div>
        <div class="maintenance-sub" id="maintenanceReason">Проходит вайп!</div>
        <div class="maintenance-timer" id="maintenanceTimer">--:--:--</div>
        <div class="maintenance-note">Приносим извинения за неудобства 🐱</div>
    </div>

    <div class="theme-modal hidden" id="themeModal">
        <div class="theme-modal-card">
            <div class="theme-modal-title">🎨 ВЫБОР ТЕМЫ</div>
            <div class="theme-modal-sub">Темы открываются по ролям и в Токен-Шопе</div>
            <div class="theme-grid" id="themeGrid"></div>
            <button class="theme-modal-close" id="themeModalClose">✖ Закрыть</button>
        </div>
    </div>
    <div class="wheel-overlay hidden" id="wheelOverlay">
        <div class="wheel-container"><div class="wheel-pointer"></div><canvas class="wheel-canvas" id="wheelCanvas" width="280" height="280"></canvas></div>
        <div class="wheel-result" id="wheelResult"></div>
        <button class="wheel-btn" id="wheelSpin">🎰 Крутить!</button>
        <button class="wheel-close" id="wheelClose">Закрыть</button>
    </div>
    <div class="ban-overlay hidden" id="banOverlay">
        <div class="ban-icon">🚫</div>
        <div class="ban-title">Аккаунт заблокирован</div>
        <div class="ban-subtitle" id="banReason"></div>
        <div class="ban-timer" id="banTimer"></div>
        <button class="ban-btn" onclick="logout()">Понятно</button>
    </div>
    <div class="case-overlay hidden" id="caseOverlay">
        <div class="case-title" id="caseTitle">🎁 ВЫБЕРИ СУНДУК</div>
        <div class="case-hint" id="caseHint">Нажми на любой сундук — внутри привилегия!</div>
        <div id="caseBody"></div>
        <div class="case-prize" id="casePrize"></div>
        <button class="case-close" id="caseClose">Закрыть</button>
    </div>
    <div class="item-modal hidden" id="itemModal">
        <div class="item-modal-card">
            <div class="item-modal-icon" id="itemModalIcon">🎁</div>
            <div class="item-modal-name" id="itemModalName">Товар</div>
            <div class="item-modal-desc" id="itemModalDesc">Описание</div>
            <div class="item-modal-price" id="itemModalPrice"></div>
            <input class="input-sm" id="itemModalInput" placeholder="Введи текст..." style="display:none; width:100%; margin-bottom:12px; text-align:center;">
            <div class="item-modal-buttons">
                <button class="item-modal-cancel" id="itemModalCancel">Отмена</button>
                <button class="item-modal-buy" id="itemModalBuy">Купить</button>
            </div>
        </div>
    </div>
    <div class="app" id="appContainer">
        <div class="login-screen" id="loginScreen">
            <div class="login-logo">🐱</div>
            <div class="login-title">Котограм</div>
            <div class="auth-toggle">
                <button class="active" id="tabLoginBtn">🔐 Войти</button>
                <button id="tabRegisterBtn">➕ Создать</button>
            </div>
            <div id="loginForm" style="width:100%; display:flex; flex-direction:column; gap:16px;">
                <div class="input-wrap"><label>🐾 Ник</label><input id="loginUsername" placeholder="Филипп"></div>
                <div class="input-wrap"><label>🔐 Пароль</label><input type="password" id="loginPassword" placeholder="Пароль"></div>
            </div>
            <div id="registerForm" style="width:100%; display:none; flex-direction:column; gap:16px;">
                <div class="input-wrap"><label>🐾 Ник</label><input id="regUsername" placeholder="Новый ник" maxlength="20"></div>
                <div class="input-wrap"><label>🔐 Пароль</label><input type="password" id="regPassword" placeholder="Минимум 6 символов"></div>
                <div class="input-wrap"><label>🔐 Повтори пароль</label><input type="password" id="regPassword2" placeholder="Ещё раз"></div>
            </div>
            <div class="error-msg" id="loginError"></div>
            <div class="success-msg" id="registerSuccess"></div>
            <button class="btn btn-primary" id="loginBtn">Войти</button>
            <button class="btn btn-success" id="registerBtn" style="display:none;">➕ Создать аккаунт</button>
            <div class="text-sm" style="text-align:center;">🎁 Новичкам — 100 🐾</div>
        </div>
        <div class="main-app" id="mainApp">
            <div class="header">
                <span class="header-logo" id="headerTitle">Котограм</span>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle">🌓</button>
                    <button class="theme-toggle" id="themeBtn" title="Темы">🎨</button>
                    <button class="btn-icon" id="logoutBtn">🚪</button>
                </div>
            </div>
            <div class="nav">
                <button class="nav-item active" data-tab="coins">🐾Койны</button>
                <button class="nav-item" data-tab="tokens">💎Токены</button>
                <button class="nav-item" data-tab="roles">🎭Роли</button>
                <button class="nav-item" data-tab="abilities">✨Возможности</button>
                <button class="nav-item" data-tab="tokenshop">🛒Токен-Шоп</button>
                <button class="nav-item" data-tab="shop">🛒Магазин</button>
                <button class="nav-item" data-tab="exchange">🔄Обмен</button>
                <button class="nav-item" data-tab="clan">🏰Клан</button>
                <button class="nav-item" data-tab="tournaments">🏆Турниры</button>
                <button class="nav-item" data-tab="wintop">💎Вин-Топ</button>
                <button class="nav-item" data-tab="wipehistory">📜Мои вайпы</button>
                <button class="nav-item" data-tab="chat" id="chatNavBtn">💬Чат<span class="badge-notif" id="chatBadge">0</span></button>
                <button class="nav-item" data-tab="private">📩ЛС</button>
                <button class="nav-item" data-tab="mod">🛡️Модер</button>
                <button class="nav-item" data-tab="roles_mgr">👑Роли-Админ</button>
                <button class="nav-item" data-tab="requests">📋Заявки</button>
                <button class="nav-item" data-tab="suspicious">🚨Античит</button>
                <button class="nav-item" data-tab="aianticheat">🤖ИИ-Античит</button>
                <button class="nav-item" data-tab="audit">🔍Аудит</button>
                <button class="nav-item" data-tab="admin">⚙️Админка</button>
                <button class="nav-item" data-tab="quests">🎯Квесты</button>
                <button class="nav-item" data-tab="auction">🔨Аукцион</button>
                <button class="nav-item" data-tab="slots">🎰Слоты</button>
                <button class="nav-item" data-tab="blackjack">🃏Блэкджек</button>
                <button class="nav-item" data-tab="fishing">🎣Рыбалка</button>
                <button class="nav-item" data-tab="stickman">🥊Драка</button>
                <button class="nav-item" data-tab="events">🎉Ивенты</button>
                <button class="nav-item" data-tab="game">🎮Игра</button>
                <button class="nav-item" data-tab="craft">⛏️Крафт</button>
            </div>
            <div class="content" id="feedContainer"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Порядок ВАЖЕН — от 01 к 11 -->
    <script src="js/01-firebase.js"></script>
    <script src="js/02-system.js"></script>
    <script src="js/03-tokens.js"></script>
    <script src="js/04-admin.js"></script>
    <script src="js/05-coins.js"></script>
    <script src="js/06-roles-cases.js"></script>
    <script src="js/07-exchange-clan.js"></script>
    <script src="js/08-shop-chat.js"></script>
    <script src="js/09-mod-audit.js"></script>
    <script src="js/12-events.js"></script>
    <script src="js/10-quests-games.js"></script>
    <script src="js/11-auth-init.js"></script>
    <script src="js/12-events.js"></script>
    <script src="js/13-craft-pvp.js"></script>
</body>
</html>
